name: Zero-Trust Security Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '37 13 * * *'

permissions:
  contents: read

jobs:
  sast_and_secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Verification
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Bandit SAST Analysis
        run: uv tool run bandit -r . -lll

  dependency_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Slopcheck scan
        run: |
          uvx slopcheck scan . > slopcheck.log || true
          cat slopcheck.log
          if grep -q "Package does not exist on PyPI" slopcheck.log; then
              echo "❌ Slopcheck found hallucinated packages. Aborting."
              exit 1
          fi

      - name: Export requirements
        run: uv export --format requirements-txt --no-emit-project -o requirements.txt

      - name: Audit dependencies
        run: uvx pip-audit -r requirements.txt