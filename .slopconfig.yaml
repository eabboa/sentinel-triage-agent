# sentinel-triage-agent slop-detector configuration
version: "2.0"

patterns:
  disabled:
    # All Python files in this project use local module imports (state, throttle,
    # llm_utils, sentinel_api) that are resolvable at runtime but not detectable
    # by the tool's static resolution. These are consistent false positives.
    - phantom_import

ignore:
  - "**/__init__.py"
  - "tests/**"
  - "**/*_test.py"
  - "**/test_*.py"
  - "**/*.pyi"
  - ".venv/**"
  - "**/__pycache__/**"
  - "test_model.py"
  - "slop_report*.json"
