[project]
name = "sentinel-triage-agent"
version = "0.6.0"
description = "LangGraph pipeline for human-in-the-loop (HITL) Microsoft Sentinel incident triage."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "aiolimiter>=1.2.1",
    "azure-identity>=1.15.0",
    "chromadb>=0.4.0",
    "fastmcp>=3.2.4",
    "langchain-google-genai>=4.2.2",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=1.1.9",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sentence-transformers>=2.2.0",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.15",
    "urllib3>=2.7.0",
    "langchain-core>=1.3.3",
    "langsmith>=0.8.0",
    "starlette>=1.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
]
