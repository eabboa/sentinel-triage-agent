[project]
name = "sentinel-triage-agent"
version = "0.9.0"
description = "LangGraph pipeline with human-in-the-loop (HITL) for Microsoft Sentinel does incident triage."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.0",
    "aiolimiter>=1.2.1",
    "azure-identity>=1.15.0",
    "chromadb>=1.5.9",
    "langchain-google-genai>=4.2.4",
    "langgraph>=1.2.4",
    "prometheus-client>=0.21.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=2.2.0",
    "structlog>=26.1.0",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.15",
    "urllib3>=2.7.0",
    "langchain-core>=1.3.3",
    "langsmith>=0.8.0",
    "pyjwt>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    "main.py",
    "seed_learning.py",
    "test_model.py",
    "tests/*",
    "nodes/learning_node.py",
]

[tool.coverage.report]
fail_under = 80

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.1",
]
